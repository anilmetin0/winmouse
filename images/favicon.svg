<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>WinMouse</title>
  <defs>
    <linearGradient id="mat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b7658"/>
      <stop offset="1" stop-color="#184a37"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3ebe4"/>
    </linearGradient>
    <pattern id="grid" width="41.2" height="41.2" patternUnits="userSpaceOnUse" x="100" y="100">
      <path d="M41.2 0V41.2H0" fill="none" stroke="#e9f2d8" stroke-opacity=".13" stroke-width="2"/>
    </pattern>
    <pattern id="major" width="206" height="206" patternUnits="userSpaceOnUse" x="100" y="100">
      <path d="M206 0V206H0" fill="none" stroke="#e9f2d8" stroke-opacity=".22" stroke-width="3"/>
    </pattern>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#06231a" flood-opacity=".45"/>
    </filter>
  </defs>
  <g filter="url(#drop)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#mat)"/>
  </g>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#grid)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#major)"/>
  </g>
  <g filter="url(#lift)">
    <path d="M512 252C626 252 700 324 700 450V604C700 716 618 790 512 790S324 716 324 604V450C324 324 398 252 512 252Z" fill="url(#body)"/>
  </g>
  <path d="M512 252V470M324 470Q512 506 700 470" fill="none" stroke="#184a37" stroke-opacity=".38" stroke-width="10" stroke-linecap="round"/>
  <rect x="487" y="322" width="50" height="104" rx="25" fill="#f2cf4a" stroke="#184a37" stroke-opacity=".35" stroke-width="6"/>
</svg>
