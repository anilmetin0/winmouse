name: Build and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Run self-tests and build the app
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: ./build.sh
      - name: Build the disk image
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ./build.sh dmg
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/WinMouse.app/Contents/Info.plist)
          [[ "$version" == "${GITHUB_REF_NAME#v}" ]] || { echo "Tag $GITHUB_REF_NAME does not match app version $version"; exit 1; }
          # The changelog section for this version becomes the release notes.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[.*\]: / { exit }
            on { print }
          ' CHANGELOG.md > build/notes.md
          [[ -s build/notes.md ]] || { echo "CHANGELOG.md has no section for $version"; exit 1; }
      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            build/WinMouse-*.dmg
            build/WinMouse-*.dmg.sha256
            build/notes.md
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Only suffixed versions (1.2.0-beta.1) are prereleases, so releases/latest always has a download.
          prerelease=$([[ "$version" == *-* ]] && echo --prerelease || true)
          gh release create "$GITHUB_REF_NAME" WinMouse-*.dmg WinMouse-*.dmg.sha256 \
            --title "WinMouse $version" --notes-file notes.md --verify-tag $prerelease
