name: Build and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check release tooling and Homebrew cask
        run: |
          python3 scripts/test-update-cask.py
          brew style Casks/winmouse.rb
      - name: Run self-tests and build the app
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: ./build.sh
      - name: Build the disk image
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ./build.sh dmg
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/WinMouse.app/Contents/Info.plist)
          [[ "$version" == "${GITHUB_REF_NAME#v}" ]] || { echo "Tag $GITHUB_REF_NAME does not match app version $version"; exit 1; }
          # The changelog section for this version becomes the release notes.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[.*\]: / { exit }
            on { print }
          ' CHANGELOG.md > build/notes.md
          [[ -s build/notes.md ]] || { echo "CHANGELOG.md has no section for $version"; exit 1; }
      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            build/WinMouse-*.dmg
            build/WinMouse-*.dmg.sha256
            build/notes.md
            build/update.json
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum -c WinMouse-*.dmg.sha256
          version="${GITHUB_REF_NAME#v}"
          # Only suffixed versions (1.2.0-beta.1) are prereleases, so releases/latest always has a download.
          release_args=()
          if [[ "$version" == *-* ]]; then release_args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" WinMouse-*.dmg WinMouse-*.dmg.sha256 \
            --title "WinMouse $version" --notes-file notes.md --verify-tag "${release_args[@]}"
      - name: Pin the stable Homebrew cask
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          checksum=$(sha256sum "WinMouse-$version.dmg" | cut -d ' ' -f 1)
          content_sha=$(git hash-object Casks/winmouse.rb)
          python3 scripts/update-cask.py "$version" "$checksum" --github-sha "$content_sha" > cask-update.json
          gh api --method PUT "repos/$GH_REPO/contents/Casks/winmouse.rb" --input cask-update.json
      - name: Publish native update information
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" update.json
